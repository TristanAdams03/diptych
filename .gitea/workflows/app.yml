# Gitea Actions copy of .github/workflows/app.yml.
name: app
# checkout@v4 (node20): act_runner 0.2.11 has no node24. github-server-url: the Linux runner
# hands job containers its compose-internal URL (http://server:3000), which they can't resolve.

on:
  push:
    paths: ["app/**", "protocol/**", "tools/data/**", "docs/research/kh1-data-draft/**", ".gitea/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "protocol/**", "tools/data/**", "docs/research/kh1-data-draft/**", ".gitea/workflows/app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: http://192.168.0.186:3001
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: KH1 data tests
        working-directory: .
        run: |
          python -m pip install --quiet pytest==8.3.4
          python -m pytest tools/data -q
      - name: KH1 assets are up to date
        working-directory: .
        run: |
          python tools/data/build_kh1_data.py
          git diff --exit-code app/app/src/main/assets/kh1
          test -z "$(git status --porcelain app/app/src/main/assets/kh1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Test, verify screenshots and assemble
        # verifyPaparazziDebug runs the unit tests in verify mode: screenshots must match src/test/snapshots.
        run: ./gradlew --no-daemon testDebugUnitTest verifyPaparazziDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kh1-map-screenshots
          path: |
            app/app/src/test/snapshots/images/*.png
            app/app/build/paparazzi/failures/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: diptych-spike-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
