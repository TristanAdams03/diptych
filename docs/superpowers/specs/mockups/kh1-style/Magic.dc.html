<div style="width: 620px; height: 540px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #0b1433; color: #f2f6ff; font-family: 'Nunito', system-ui, sans-serif; position: relative; overflow: hidden;">

  <div style="display: flex; gap: 10px; flex-grow: 1; min-height: 0;">

        <button style="height: 52px; border-radius: 12px; border: 2px solid #d8e6ff; background: #2b56c4; color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;">Thundara<div style="font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; color: #cfe0ff;">1 MP</div></button>

        <button style="height: 52px; border-radius: 12px; border: 2px solid #d8e6ff; background: #2b56c4; color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;">Tent<div style="font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; color: #cfe0ff;">× 2</div></button>
        <button disabled style="height: 52px; border-radius: 12px; border: 2px dashed #5b6fa3; background: #0e1a45; color: #8a9bc9; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px;">Mega-Potion<div style="font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;">none left</div></button>
      </div>
    </section>
  </div>

    <a href="#" style="flex: 1; height: 44px; border-radius: 10px; color: #8a9bc9; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1px; text-decoration: none;">JOURNAL</a>
  </nav>

  <div style="position: absolute; left: 0; top: 0; width: 620px; height: 540px; background: rgba(5, 9, 26, 0.6);"></div>
  <section aria-label="Cura target" style="position: absolute; left: 60px; right: 60px; bottom: 76px; background: #15235a; border: 3px solid #ffd166; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 19px; color: #ffd166;">Cura · who needs it?</div>

      <button style="height: 64px; border-radius: 14px; border: 2px solid #d8e6ff; background: #2b56c4; color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer;">Sora<div style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; color: #4fe08a;">55 / 57</div></button>
      <button style="height: 64px; border-radius: 14px; border: 3px solid #ffb84f; background: #2b56c4; color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer;">Donald<div style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; color: #ffb84f;">18 / 46 · lowest</div></button>
      <button style="height: 64px; border-radius: 14px; border: 2px solid #d8e6ff; background: #2b56c4; color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer;">Beast<div style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; color: #4fe08a;">66 / 66</div></button>
    </div>
    <button style="align-self: center; height: 44px; padding: 0 28px; border-radius: 12px; border: 2px solid #7f9de0; background: #0b1433; color: #dce6ff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer;">Cancel</button>
