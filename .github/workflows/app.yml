name: app

on:
  push:
    paths: ["app/**", "protocol/**", "tools/data/**", "docs/research/kh1-data-draft/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "protocol/**", "tools/data/**", "docs/research/kh1-data-draft/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: KH1 data tests
        working-directory: .
        run: |
          python -m pip install --quiet pytest==8.3.4
          python -m pytest tools/data -q
      - name: KH1 assets are up to date
        working-directory: .
        run: |
          python tools/data/build_kh1_data.py
          git diff --exit-code app/app/src/main/assets/kh1
          test -z "$(git status --porcelain app/app/src/main/assets/kh1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Test and assemble
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: diptych-spike-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
